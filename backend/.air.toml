root = "."
tmp_dir = "tmp"

[build]
  # Windows membutuhkan ekstensi .exe agar CMD bisa menjalankan binary hasil build
  cmd = "go build -o tmp/server.exe ./cmd/server"
  entrypoint = ["./tmp/server.exe"]
  args_bin = ["-port", "8080"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp"]
  include_dir = ["internal", "cmd", "migrations"]
  delay = 1000
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500
  log = "build-errors.log"

[log]
  time = false
  main_only = false

[misc]
  clean_on_exit = true